name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test suite
        # The suite runs on the deterministic heuristic backend, so it needs no
        # GPU, no model download and no network. That is deliberate: a CI gate
        # that depends on an external model is not a gate.
        run: pytest -q --maxfail=5

      - name: CyberMetric gate
        # Exits non-zero when hallucination rate, precision, recall or p95
        # latency cross the thresholds declared in src/eval/cybermetric_bench.py.
        # This is the ledger the README describes.
        run: python -m src.eval.cybermetric_bench --backend heuristic --out reports/cybermetric_ci.json

      - name: Bandit (SAST)
        # High-severity only. The badge on the README claims SAST verification,
        # so this step is what makes that claim true.
        run: bandit -r src -ll -q

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybermetric-py${{ matrix.python-version }}
          path: reports/cybermetric_ci.json
          if-no-files-found: ignore
