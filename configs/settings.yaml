runtime:
  backend: auto            # ollama | vllm | hf | heuristic
  model: qwen2.5:3b
  temperature: 0.1
brain:
  max_react_steps: 8
  query_window_minutes: 1440
  neighbour_window_minutes: 60
explainability:
  output_dir: docs/xai_reports
  emit_mermaid_timeline: true
evaluation:
  scenarios: data/golden/scenarios.json
  thresholds:
    hallucination_rate_max: 0.30
    precision_min: 0.60
    recall_min: 0.60
    p95_latency_ms_max: 15000

# --- model supply chain -------------------------------------------------
# Weight-downloading backends (hf, vllm) refuse to run without a pinned
# revision. Set this to the exact commit hash you have verified; a branch name
# is not a pin, because the head moves.
#
# Find a model's commit hash with:
#   huggingface-cli scan-cache        # for models already downloaded
#   or the "Commit history" link on the model's Hub page
#
model_supply_chain:
  revision: null              # e.g. "0e3c3b9a6c1cbad4a1a1a9f4e6d1c2b3a4f5e6d7"
  allow_unpinned: false       # opting out is deliberate and logged
